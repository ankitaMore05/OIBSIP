<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc">
    <div id="display" aria-live="polite">0</div>
    <div class="keys">
      <button class="fn" data-action="clear">C</button>
      <button class="fn" data-action="back">&#9003;</button>
      <button class="op" data-op="&divide;">&divide;</button>
      <button class="op" data-op="&times;">&times;</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="op" data-op="&minus;">&minus;</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="op" data-op="+">+</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="eq" data-action="equals">=</button>

      <button class="zero" data-digit="0">0</button>
      <button data-digit=".">.</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
